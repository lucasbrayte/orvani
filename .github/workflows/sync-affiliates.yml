name: Sync affiliate catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        type: choice
        default: validate
        options:
          - validate
          - setup-dry-run
          - pending
          - full
          - setup
      confirm_setup:
        description: Confirm the authorized write to the Importações sheet
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3,15 * * *"
    - cron: "17 0-2,4-14,16-23 * * *"

permissions:
  contents: read

concurrency:
  group: affiliate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run affiliate synchronization
        env:
          AFFILIATE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '17 3,15 * * *' && 'full' || 'pending') }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ORVANI_IMPORT_WORKSHEET: ${{ vars.ORVANI_IMPORT_WORKSHEET }}
          ORVANI_PRODUCTS_WORKSHEET: ${{ vars.ORVANI_PRODUCTS_WORKSHEET }}
          ORVANI_CONFIRM_SETUP: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_setup || false }}
        run: .github/scripts/run-affiliate-sync.sh "$AFFILIATE_MODE"
